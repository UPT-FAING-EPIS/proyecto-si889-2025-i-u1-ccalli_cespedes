name: Construcción de infraestructura en Azure

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

jobs:
  Deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Azure CLI
        run: az login -u ${{ secrets.AZURE_USERNAME }} -p ${{ secrets.AZURE_PASSWORD }}

      - name: Crear archivo terraform.tfvars
        run: |
          cd infra
          echo "suscription_id=\"${{ secrets.SUSCRIPTION_ID }}\"" > terraform.tfvars
          echo "sqladmin_username=\"${{ secrets.SQL_USER }}\"" >> terraform.tfvars
          echo "sqladmin_password=\"${{ secrets.SQL_PASS }}\"" >> terraform.tfvars

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: cd infra && terraform init

      - name: Validar Terraform
        run: cd infra && terraform validate -no-color

      - name: Planificar despliegue
        run: |
          cd infra
          terraform plan \
            -var="suscription_id=${{ secrets.SUSCRIPTION_ID }}" \
            -var="sqladmin_username=${{ secrets.SQL_USER }}" \
            -var="sqladmin_password=${{ secrets.SQL_PASS }}" \
            -no-color -out main.tfplan

      - name: Exportar resumen del plan
        id: tf-plan-string
        run: |
          TERRAFORM_PLAN=$(cd infra && terraform show -no-color main.tfplan)
          delimiter="$(openssl rand -hex 8)"
          echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
          echo "## Terraform Plan Output" >> $GITHUB_OUTPUT
          echo "<details><summary>Click para ver detalles</summary>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```terraform' >> $GITHUB_OUTPUT
          echo "$TERRAFORM_PLAN" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "</details>" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Publicar plan en resumen del job
        env:
          SUMMARY: ${{ steps.tf-plan-string.outputs.summary }}
        run: echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: Obtener versión y arquitectura para Terramaid
        id: vars
        run: |
          echo "terramaid_version=$(curl -s https://api.github.com/repos/RoseSecurity/Terramaid/releases/latest | grep tag_name | cut -d '\"' -f 4)" >> $GITHUB_OUTPUT
          case "${{ runner.arch }}" in
            "X64") echo "arch=x86_64" >> $GITHUB_OUTPUT ;;
            "ARM64") echo "arch=arm64" >> $GITHUB_OUTPUT ;;
          esac

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar Terramaid
        run: |
          curl -L -o /tmp/terramaid.tar.gz "https://github.com/RoseSecurity/Terramaid/releases/download/${{ steps.vars.outputs.terramaid_version }}/Terramaid_Linux_${{ steps.vars.outputs.arch }}.tar.gz"
          tar -xzvf /tmp/terramaid.tar.gz -C /tmp
          mv -v /tmp/Terramaid /usr/local/bin/terramaid
          chmod +x /usr/local/bin/terramaid

      - name: Ejecutar Terramaid
        run: |
          cd infra
          terramaid run

      - name: Publicar grafo de Terramaid
        run: |
          echo "## Grafo de Infraestructura Terramaid" >> $GITHUB_STEP_SUMMARY
          cat infra/Terramaid.md >> $GITHUB_STEP_SUMMARY

      - name: Configurar Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Instalar Inframap
        run: |
          curl -L -o /tmp/inframap.tar.gz "https://github.com/cycloidio/inframap/releases/download/v0.7.0/inframap-linux-amd64.tar.gz"
          tar -xzvf /tmp/inframap.tar.gz -C /tmp
          mv -v /tmp/inframap-linux-amd64 /usr/local/bin/inframap
          chmod +x /usr/local/bin/inframap

      - name: Generar grafo SVG con Inframap
        run: |
          cd infra
          inframap generate main.tf --raw | dot -Tsvg > inframap_azure.svg

      - name: Subir grafo de Inframap
        uses: actions/upload-artifact@v4
        with:
          name: inframap_azure.svg
          path: infra/inframap_azure.svg

      - name: Configurar Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generar reporte de costos
        run: |
          cd infra
          infracost breakdown --path . --format html --out-file infracost-report.html
          sed -i '19,137d' infracost-report.html
          sed -i 's/$0/$ 0/g' infracost-report.html

      - name: Convertir HTML a Markdown
        id: html2markdown
        uses: rknj/html2markdown@v1.1.0
        with:
          html-file: "infra/infracost-report.html"

      - name: Publicar reporte de costos
        run: |
          echo "## Reporte de Costos (Infracost)" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.html2markdown.outputs.markdown-content }}" >> infracost.md
          cat infracost.md >> $GITHUB_STEP_SUMMARY

      - name: Aplicar cambios con Terraform
        run: |
          cd infra
          terraform apply \
            -var="suscription_id=${{ secrets.SUSCRIPTION_ID }}" \
            -var="sqladmin_username=${{ secrets.SQL_USER }}" \
            -var="sqladmin_password=${{ secrets.SQL_PASS }}" \
            -auto-approve main.tfplan
